clean:
  fields:
    device_id: &device
      required: true
      selector:
        device:
          integration: vacuula
    map_id: &map
      selector:
        text:
    cleaning_type:
      default: auto
      selector:
        select:
          translation_key: cleaning_type
          options: [auto, map, house]
    zone_ids:
      selector:
        object:
    mode:
      default: eco
      selector:
        select:
          translation_key: cleaning_mode
          options: [eco, turbo, auto, max]
    navigation:
      default: normal
      selector:
        select:
          translation_key: navigation_mode
          options: [normal, extra_care, deep, gentle]
    nogo_enabled:
      default: true
      selector:
        boolean:
set_schedule:
  fields:
    device_id: *device
    events:
      required: true
      selector:
        object:
    time_basis:
      default: local
      selector:
        select:
          translation_key: time_basis
          options: [local, utc]
update_schedule_event:
  fields:
    device_id: *device
    event_id:
      selector:
        text:
    enabled:
      selector:
        boolean:
    days:
      selector:
        select:
          translation_key: weekday
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    time:
      selector:
        text:
    map_id: *map
    cleaning_type:
      selector:
        select:
          translation_key: cleaning_type
          options: [auto, map, house]
    zone_ids:
      selector:
        object:
    mode:
      selector:
        select:
          translation_key: cleaning_mode
          options: [eco, turbo, auto, max]
    navigation:
      selector:
        select:
          translation_key: navigation_mode
          options: [normal, gentle]
    nogo_enabled:
      selector:
        boolean:
delete_schedule_event:
  fields:
    device_id: *device
    event_id:
      required: true
      selector:
        text:
set_boundaries:
  fields:
    device_id: *device
    map_id:
      required: true
      selector:
        text:
    boundaries:
      required: true
      selector:
        object:
rename_robot:
  fields:
    device_id: *device
    name:
      required: true
      selector:
        text:
update_map:
  fields:
    device_id: *device
    map_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
map_action:
  fields:
    device_id: *device
    map_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          translation_key: map_action
          options: [promote, use, unuse, demote]
    confirm_server_restarted:
      selector:
        boolean:
get_data:
  fields:
    device_id: *device
    resource:
      required: true
      selector:
        select:
          translation_key: data_resource
          options:
            - state
            - info
            - stats
            - preferences
            - schedule
            - maps
            - runs
            - map
            - run
            - boundaries
            - log_upload_state
    map_id: *map
    run_id:
      selector:
        text:
factory_reset:
  fields:
    device_id: *device
    confirm:
      required: true
      default: false
      selector:
        boolean:
